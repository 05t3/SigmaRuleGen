# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which checks out the code, builds a container
# image using Docker and scans that image for vulnerabilities using
# Snyk. The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity
# issues, monitor images for newly disclosed vulnerabilities in Snyk and
# fail PR checks for new vulnerabilities, see https://github.com/snyk/actions/

name: Snyk Container Scanner

on:
  workflow_run:
    workflows: ["Build and Push Docker Image to Docker Hub and GHCR using VERSION file"]
    types:
      - completed

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  snyk-scan:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: get_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set lowercase image name (repo only)
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Docker login (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull GHCR image
        run: docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}

      - name: Pull Docker Hub image
        run: docker pull oste/${{ steps.image.outputs.name }}:${{ steps.get_version.outputs.version }}

      - name: Scan GHCR image with Snyk
        continue-on-error: true
        uses: snyk/actions/docker@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
          args: >
            --file=Dockerfile
            --sarif-file-output=snyk-ghcr.sarif
            --exclude-base-image-vulns

      - name: Scan Docker Hub image with Snyk
        continue-on-error: true
        uses: snyk/actions/docker@0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: oste/${{ steps.image.outputs.name }}:${{ steps.get_version.outputs.version }}
          args: >
            --file=Dockerfile
            --sarif-file-output=snyk-dockerhub.sarif
            --exclude-base-image-vulns

      - name: Upload GHCR scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-ghcr.sarif
          category: snyk-ghcr

      - name: Upload Docker Hub scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dockerhub.sarif
          category: snyk-dockerhub



