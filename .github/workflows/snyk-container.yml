# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which checks out the code, builds a container
# image using Docker and scans that image for vulnerabilities using
# Snyk. The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity
# issues, monitor images for newly disclosed vulnerabilities in Snyk and
# fail PR checks for new vulnerabilities, see https://github.com/snyk/actions/

name: Snyk Container Scan

on:
  workflow_run:
    workflows: ["Build and Push Docker Image to Docker Hub and GHCR using VERSION file"]
    types:
      - completed

permissions:
  contents: read
  security-events: write  # Needed to upload SARIF
  actions: read
  packages: read

jobs:
  snyk-scan:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from file
        id: version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV
      - name: Set lowercase image name
        id: image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=$(basename "${REPO_LOWER}")
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Docker login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # ----- DockerHub Scan -----
      - name: Pull DockerHub image
        run: docker pull oste/sigmarulegen:$VERSION

      - name: Snyk scan (DockerHub)
        run: snyk container test oste/sigmarulegen:$VERSION --file=Dockerfile --sarif-file-output=snyk-dockerhub.sarif || true

      - name: Upload SARIF (DockerHub)
        if: hashFiles('snyk-dockerhub.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dockerhub.sarif
          category: snyk-dockerhub

      # ----- GHCR Scan -----
      - name: Pull GHCR image
        run: docker pull ghcr.io/oste/sigmarulegen:$VERSION

      - name: Snyk scan (GHCR)
        run: snyk container test ghcr.io/oste/sigmarulegen:$VERSION --file=Dockerfile --sarif-file-output=snyk-ghcr.sarif || true

      - name: Upload SARIF (GHCR)
        if: hashFiles('snyk-ghcr.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-ghcr.sarif
          category: snyk-ghcr








