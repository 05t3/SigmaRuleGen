# A sample workflow which checks out the code, builds a container
# image using Docker and scans that image for vulnerabilities using
# Snyk. The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity
# issues, monitor images for newly disclosed vulnerabilities in Snyk and
# fail PR checks for new vulnerabilities, see https://github.com/snyk/actions/

name: Snyk Container Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: oste/sigmarulegen:1.0.0
      GHCR_IMAGE: ghcr.io/oste/sigmarulegen:1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login - DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Login - GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull DockerHub image
        run: docker pull $DOCKERHUB_IMAGE

      - name: Pull GHCR image
        run: docker pull $GHCR_IMAGE

      - name: Install Snyk CLI
        run: |
          curl -sL https://github.com/snyk/snyk/releases/latest/download/snyk-linux \
            -o /usr/local/bin/snyk && chmod +x /usr/local/bin/snyk

      - name: Auth Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Scan - DockerHub
        run: |
          snyk container test $DOCKERHUB_IMAGE \
            --file=Dockerfile \
            --sarif-file-output=snyk-dockerhub.sarif || true

      - name: Snyk Scan - GHCR
        run: |
          snyk container test $GHCR_IMAGE \
            --file=Dockerfile \
            --sarif-file-output=snyk-ghcr.sarif || true

      - name: Upload SARIF - DockerHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dockerhub.sarif
          category: snyk-dockerhub

      - name: Upload SARIF - GHCR
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-ghcr.sarif
          category: snyk-ghcr






