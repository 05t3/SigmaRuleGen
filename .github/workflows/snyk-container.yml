# A sample workflow which checks out the code, builds a container
# image using Docker and scans that image for vulnerabilities using
# Snyk. The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity
# issues, monitor images for newly disclosed vulnerabilities in Snyk and
# fail PR checks for new vulnerabilities, see https://github.com/snyk/actions/

name: Snyk Container Scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  DOCKERHUB_IMAGE: oste/sigmarulegen:1.0.0
  GHCR_IMAGE: ghcr.io/oste/sigmarulegen:1.0.0

jobs:
  snyk:
    name: Snyk Scan - DockerHub & GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker auth for DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker auth for GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Snyk CLI
        run: |
          npm install -g snyk

      - name: Auth Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # GHCR Image Scan
      - name: Pull GHCR Image
        id: ghcr_pull
        run: |
          docker pull $GHCR_IMAGE || echo "GHCR image not found"

      - name: Scan GHCR Image with Snyk
        if: steps.ghcr_pull.outcome == 'success'
        run: |
          snyk container test $GHCR_IMAGE \
            --file=Dockerfile \
            --sarif-file-output=snyk-ghcr.sarif || echo "Snyk GHCR scan failed"

      # DockerHub Image Scan
      - name: Pull DockerHub Image
        id: dockerhub_pull
        run: |
          docker pull $DOCKERHUB_IMAGE || echo "DockerHub image not found"

      - name: Scan DockerHub Image with Snyk
        if: steps.dockerhub_pull.outcome == 'success'
        run: |
          snyk container test $DOCKERHUB_IMAGE \
            --file=Dockerfile \
            --sarif-file-output=snyk-dockerhub.sarif || echo "Snyk DockerHub scan failed"

      # Upload SARIF individually
      - name: Upload SARIF for GHCR
        if: steps.ghcr_pull.outcome == 'success' && hashFiles('snyk-ghcr.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-ghcr.sarif
          category: snyk-ghcr

      - name: Upload SARIF for DockerHub
        if: steps.dockerhub_pull.outcome == 'success' && hashFiles('snyk-dockerhub.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dockerhub.sarif
          category: snyk-dockerhub







