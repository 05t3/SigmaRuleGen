name: Trivy Container Scanner

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 4 * * 6'  # Every Saturday at 04:00

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: get_version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set lowercase image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Pull Docker image
        run: docker pull oste/${{ steps.image.outputs.name }}:${{ steps.get_version.outputs.version }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master  # ✅ Safe fallback; or tag a release version
        with:
          image-ref: oste/${{ steps.image.outputs.name }}:${{ steps.get_version.outputs.version }}
          format: 'sarif'
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload SARIF to GitHub (Trivy)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan
